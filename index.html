<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Bubble - Snippet Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating Bubble Button -->
    <div id="bubble" class="bubble" title="Click to open snippets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
    </div>

    <!-- Main Panel -->
    <div id="panel" class="panel hidden">
        <div class="panel-header">
            <h2>Inspection Snippets</h2>
            <div class="header-buttons">
                <button id="settingsBtn" class="icon-btn" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                </button>
                <button id="closeBtn" class="icon-btn" title="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search snippets..." autocomplete="off">
            <button id="clearSearch" class="clear-btn hidden">×</button>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="search-results hidden"></div>

        <!-- Categories Grid -->
        <div id="categoriesView" class="categories-grid"></div>

        <!-- Snippets View -->
        <div id="snippetsView" class="snippets-view hidden">
            <button id="backBtn" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                <span id="currentCategory">Back to Categories</span>
            </button>
            <div id="snippetsList" class="snippets-list"></div>
        </div>

        <!-- Copy Notification -->
        <div id="copyNotification" class="copy-notification hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            Copied to clipboard!
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="closeSettingsBtn" class="icon-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="settings-tabs">
                <button class="tab-btn active" data-tab="categories">Categories</button>
                <button class="tab-btn" data-tab="snippets">Snippets</button>
                <button class="tab-btn" data-tab="import-export">Import/Export</button>
            </div>

            <!-- Categories Tab -->
            <div id="categoriesTab" class="tab-content active">
                <div class="add-form">
                    <input type="text" id="newCategoryName" placeholder="New category name...">
                    <input type="text" id="newCategoryIcon" placeholder="Emoji (optional)" maxlength="2">
                    <button id="addCategoryBtn" class="primary-btn">Add Category</button>
                </div>
                <div id="categoriesList" class="settings-list"></div>
            </div>

            <!-- Snippets Tab -->
            <div id="snippetsTab" class="tab-content hidden">
                <div class="add-form">
                    <select id="snippetCategory">
                        <option value="">Select category...</option>
                    </select>
                    <input type="text" id="newSnippetTitle" placeholder="Snippet title...">
                    <textarea id="newSnippetText" placeholder="Snippet text..."></textarea>
                    <button id="addSnippetBtn" class="primary-btn">Add Snippet</button>
                </div>
                <div class="snippet-filter">
                    <label>Filter by category:</label>
                    <select id="filterCategory">
                        <option value="">All categories</option>
                    </select>
                </div>
                <div id="allSnippetsList" class="settings-list"></div>
            </div>

            <!-- Import/Export Tab -->
            <div id="importExportTab" class="tab-content hidden">
                <div class="import-export-section">
                    <h3>Export Data</h3>
                    <p>Download all your categories and snippets as a JSON file.</p>
                    <button id="exportBtn" class="primary-btn">Export Data</button>
                </div>
                <div class="import-export-section">
                    <h3>Import Data</h3>
                    <p>Import categories and snippets from a JSON file. This will merge with existing data.</p>
                    <input type="file" id="importFile" accept=".json">
                    <button id="importBtn" class="primary-btn">Import Data</button>
                </div>
                <div class="import-export-section danger">
                    <h3>Reset Data</h3>
                    <p>Delete all categories and snippets and restore defaults.</p>
                    <button id="resetBtn" class="danger-btn">Reset to Defaults</button>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
